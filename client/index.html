<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4eff7" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23058c62'/%3E%3Cpath d='M8 20c2-7 6-10 16-9-1 9-6 12-16 9z' fill='%23fff'/%3E%3C/svg%3E" />
    <script>
      (function () {
        var p = 'green';
        try { var v = localStorage.getItem('pk_palette'); if (v === 'blue' || v === 'green') p = v; } catch (e) {}
        document.documentElement.setAttribute('data-palette', p);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', p === 'blue' ? '#f9fafb' : '#f4eff7');
      })();
    </script>
    <title>Pasar Keripik</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
